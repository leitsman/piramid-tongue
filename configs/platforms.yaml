# Platform Definitions for Piramid-Tongue
# Define external learning platforms with their metrics and CEFR mappings
# Adding a new platform only requires adding an entry here (no code changes)

youtalk:
  display_name: "YouTalk"
  description: "Video/audio-based English learning platform with structured units"
  curriculum:
    naming_convention: "G{unit}-{video}"
    description: "G=Grammar, V=Vocab, S=Sentences. Format: {type}{unit}-{video}"
    videos_per_unit: 3
    unit_types:
      - grammar
      - vocab
      - sentences
    levels:
      Basic:
        unit_range: "1-15"
        topics:
          "1": ["articles", "definite/indefinite articles"]
          "2": ["present simple", "present continuous"]
          "3": ["pronouns: subject/object", "possessive pronouns"]
          "4": ["possessive adjectives", "possessive 's"]
          "5": ["prepositions of time", "prepositions of place"]
          "6": ["question tags"]
          "7": ["adverbs of frequency", "adverbs of manner"]
          "8": ["comparatives", "superlatives"]
          "9": ["countable/uncountable", "some/any"]
          "10": ["past simple: regular verbs", "past simple: irregular verbs"]
          "11": ["past continuous"]
          "12": ["future with will", "future with going to"]
          "13": ["present perfect simple"]
          "14": ["modal verbs: can/could/must/should"]
          "15": ["conditional type 0", "conditional type 1"]
      Intermediate:
        unit_range: "16-30"
        topics:
          "16": ["present perfect continuous", "past perfect simple"]
          "17": ["conditionals type 2", "conditionals type 3"]
          "18": ["passive voice: present", "passive voice: past"]
          "19": ["passive voice: future", "passive voice: perfect"]
          "20": ["reported speech: statements", "reported speech: questions"]
          "21": ["relative clauses: defining", "relative clauses: non-defining"]
          "22": ["modal verbs: deduction (must/might/could/can't)"]
          "23": ["wish/if only", "would rather"]
          "24": ["inversion after negative adverbials"]
          "25": ["causative: have/get something done"]
          "26": ["phrasal verbs: separable/inseparable"]
          "27": ["linking words: despite/although/nevertheless"]
          "28": ["future perfect", "future continuous"]
          "29": ["participle clauses"]
          "30": ["mixed conditionals"]
  levels:
    - "Basic"
    - "Intermediate"
    - "Advanced"
  units_per_level: 15
  level_to_cefr:
    Basic:
      cefr: "A2"
      confidence: 0.8
    Intermediate:
      cefr: "B1"
      confidence: 0.7
    Advanced:
      cefr: "B2"
      confidence: 0.6
  metrics:
    current_level:
      type: "select"
      options:
        - "Basic"
        - "Intermediate"
        - "Advanced"
      questions:
        - "¿En qué nivel estás actualmente en YouTalk? (Basic/Intermediate/Advanced)"
    current_unit:
      type: "number"
      min: 1
      max: 15
      questions:
        - "¿En qué unidad estás ahora mismo? (1-15)"
    total_units_completed:
      type: "number"
      min: 0
      questions:
        - "¿Cuántas unidades has completado en total?"
    last_practice:
      type: "date"
      questions:
        - "¿Cuándo fue tu última práctica en YouTalk? (YYYY-MM-DD o 'nunca')"
    weekly_goal:
      type: "number"
      min: 1
      questions:
        - "¿Cuál es tu meta semanal de sesiones en YouTalk?"
    sessions_this_week:
      type: "number"
      min: 0
      questions:
        - "¿Cuántas sesiones has hecho esta semana en YouTalk?"

duolingo:
  display_name: "Duolingo"
  description: "Gamified language learning app"
  levels: []  # Duolingo doesn't have clear level progression
  level_to_cefr:
    # Duolingo uses XP and leagues instead of levels
    # Mapping is based on user research, not official
    Bronze:
      cefr: "A1"
      confidence: 0.5
    Silver:
      cefr: "A2"
      confidence: 0.5
    Gold:
      cefr: "A2"
      confidence: 0.6
    Sapphire:
      cefr: "B1"
      confidence: 0.6
    Ruby:
      cefr: "B1"
      confidence: 0.7
    Diamond:
      cefr: "B2"
      confidence: 0.7
    Obsidian:
      cefr: "C1"
      confidence: 0.6
  metrics:
    streak:
      type: "number"
      min: 0
      questions:
        - "¿Cuál es tu racha actual en días?"
    total_xp:
      type: "number"
      min: 0
      questions:
        - "¿Cuántos XP tienes en total? (opcional, presiona Enter para omitir)"
    league:
      type: "select"
      options:
        - "Bronze"
        - "Silver"
        - "Gold"
        - "Sapphire"
        - "Ruby"
        - "Diamond"
        - "Obsidian"
      questions:
        - "¿En qué liga estás actualmente?"
    last_practice:
      type: "date"
      questions:
        - "¿Cuándo fue tu última práctica en Duolingo? (YYYY-MM-DD o 'nunca')"
    weekly_goal:
      type: "number"
      min: 1
      questions:
        - "¿Cuál es tu meta semanal de XP?"
    xp_this_week:
      type: "number"
      min: 0
      questions:
        - "¿Cuántos XP has ganado esta semana?"
